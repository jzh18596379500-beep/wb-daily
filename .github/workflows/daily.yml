name: WorkBuddy daily credits

on:
  schedule:
    - cron: "10 0 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run daily credits
        env:
          WB_TOKEN: ${{ secrets.WB_TOKEN }}
        run: python wb_daily.py
