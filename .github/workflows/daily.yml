name: WorkBuddy daily credits

on:
  schedule:
    # UTC 00:10 = 北京时间 08:10，每天领积分
    - cron: "10 0 * * *"
    # UTC 00:00 = 北京时间 08:00，每月 1 号和 15 号保活
    - cron: "0 0 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    if: github.event.schedule != '0 0 1,15 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run daily credits
        env:
          WB_TOKEN: ${{ secrets.WB_TOKEN }}
        run: python wb_daily.py

  keepalive:
    if: github.event.schedule == '0 0 1,15 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Touch keepalive file
        run: |
          date -u +"last touched: %Y-%m-%d %H:%M:%S UTC" > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "chore: keepalive" || echo "nothing to commit"
          git push
